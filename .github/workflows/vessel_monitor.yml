name: Vessel Monitor

on:
  schedule:
    # 北京时间 08:00（UTC 00:00），上午上班前
    - cron: '0 0 * * 1-5'
    # 北京时间 14:00（UTC 06:00），下午上班前
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      use_shipxy:
        description: '是否使用船讯网 API（消耗免费额度）'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore vessel state
        uses: actions/cache@v4.2.0
        with:
          path: vessel_state.json
          key: vessel-state-${{ github.run_id }}
          restore-keys: |
            vessel-state-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHIPXY_API_KEY: ${{ secrets.SHIPXY_API_KEY }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT: ${{ github.event_name }}
          MANUAL_USE_SHIPXY: ${{ github.event.inputs.use_shipxy }}
        run: python vessel_monitor.py

      - name: Save vessel state
        uses: actions/cache/save@v4.2.0
        if: always()
        with:
          path: vessel_state.json
          key: vessel-state-${{ github.run_id }}
