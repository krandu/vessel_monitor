name: Vessel Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests websocket-client

      - name: Restore vessel state
        uses: actions/cache@v4
        with:
          path: vessel_state.json
          key: vessel-state-${{ github.run_id }}
          restore-keys: |
            vessel-state-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python vessel_monitor.py

      - name: Save vessel state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: vessel_state.json
          key: vessel-state-${{ github.run_id }}
